<!doctype html>
<meta charset="utf-8">
<style>
  body { width: 340px; font: 14px system-ui; margin: 12px; }
  h1 { font-size: 16px; margin: 0 0 2px; }
  .orig { color: #777; font-size: 12px; margin-bottom: 8px; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .tag { background: #eef3ff; color: #2d5fc4; border-radius: 12px; padding: 2px 8px; font-size: 12px; }
  .row { display: flex; align-items: center; gap: 6px; border: 1px solid #ddd; border-radius: 8px; padding: 6px 8px; margin-bottom: 6px; }
  .q { flex: 1; font-weight: 600; }
  button { cursor: pointer; padding: 6px 10px; border-radius: 6px; border: 0; background: #2d7ff9; color: #fff; }
  button.sec { background: #eee; color: #222; }
  .warn { color: #b26a00; font-size: 12px; margin-bottom: 8px; }
  .prem { background: #fff1d6; color: #9a5b00; border-radius: 4px; padding: 1px 5px; font-size: 11px; font-weight: 600; cursor: help; }
  .folder { display: block; margin-bottom: 2px; font-size: 13px; }
  .hint { color: #888; font-size: 11px; margin: 2px 0 6px; word-break: break-all; }
  .settings { margin-top: 12px; border-top: 1px solid #ddd; padding-top: 8px; }
  summary { cursor: pointer; color: #555; }
  .field { margin: 8px 0 4px; }
  .field label { display: block; font-size: 12px; color: #555; margin-bottom: 2px; }
  .field input { width: 100%; box-sizing: border-box; padding: 5px 7px; border: 1px solid #ccc; border-radius: 6px; font: 12px ui-monospace, monospace; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; align-items: center; }
  .chip { background: #eee; color: #222; padding: 2px 6px; font: 11px ui-monospace, monospace; }
  .empty { color: #888; }
</style>
<div id="root"></div>
<script src="shared.js"></script>
<script src="collect.js"></script>
<script src="popup.js"></script>
